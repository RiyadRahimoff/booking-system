  version: '3.8'

  services:

    postgres:
      image: postgres:16-alpine
      container_name: bookflow-postgres
      environment:
        POSTGRES_DB: bookflow_db
        POSTGRES_USER: ${DB_USERNAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

    redis:
      image: redis:latest
      container_name: bookflow-redis
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data

    rabbitmq:
      image: rabbitmq:3-management
      container_name: bookflow-rabbitmq
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      ports:
        - "5672:5672"
        - "15672:15672"

  volumes:
    postgres_data:
    redis_data:

